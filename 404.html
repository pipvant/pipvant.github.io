<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Page not found — PIPVANT</title>
  <meta name="description" content="This PIPVANT page does not exist. Head back to the toolkit — journal, risk calculators and the prop-firm matcher.">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#0A1628">
  <link rel="icon" type="image/png" href="/assets/pipvanta-logo.png">
  <style>
    :root{
      --bg:#0A1628; --surface:#0F1D33; --raised:#14253F; --line:#1C2F4D; --line-strong:#2B4266;
      --text:#F4F6F8; --secondary:#A9B6C6; --muted:#8B9AB0;
      --accent:#5B8DEF; --gold:#D4AF37;
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; color:var(--text);
      font-family:"Space Grotesk",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
      -webkit-font-smoothing:antialiased;
      display:flex; align-items:center; justify-content:center; padding:24px 18px;
      background:
        radial-gradient(900px 420px at 50% -120px, rgba(212,175,55,.12), transparent 65%),
        radial-gradient(700px 460px at 85% 110%, rgba(91,141,239,.10), transparent 60%),
        var(--bg);
    }
    .card{
      width:100%; max-width:480px; text-align:center;
      background:linear-gradient(180deg, rgba(20,37,63,.72), rgba(15,29,51,.94));
      border:1px solid var(--line-strong); border-radius:22px; padding:44px 34px 38px;
      box-shadow:0 30px 80px rgba(0,0,0,.45), inset 0 1px 0 rgba(212,175,55,.10);
    }
    .card img{width:64px;height:64px;border-radius:16px;object-fit:contain;box-shadow:0 8px 24px rgba(212,175,55,.25)}
    .eyebrow{
      margin:22px 0 0; color:var(--accent); font-size:12px; font-weight:700;
      letter-spacing:.18em; text-transform:uppercase;
    }
    h1{margin:10px 0 0; font-size:clamp(1.9rem,6vw,2.5rem); line-height:1.12; letter-spacing:-.02em}
    h1 .gold{color:var(--gold)}
    .msg{margin:14px auto 0; max-width:360px; color:var(--secondary); font-size:14.5px; line-height:1.65}
    .cta{
      display:inline-block; margin-top:26px; min-height:48px; padding:13px 26px;
      background:var(--gold); color:#0A1628; font-weight:700; font-size:15px;
      text-decoration:none; border-radius:11px; box-shadow:0 10px 28px rgba(212,175,55,.28);
    }
    .cta:hover{background:#E3C04A}
    .cta:focus-visible{outline:2px solid var(--accent); outline-offset:3px}
    .foot{margin:22px 0 0; color:var(--muted); font-size:12px; letter-spacing:.04em}
    .foot b{color:var(--secondary)}
  </style>
</head>
<body>
  <main class="card">
    <img src="/assets/pipvanta-logo.png" alt="PIPVANT">
    <p class="eyebrow">PIPVANT · Error 404</p>
    <h1>Page not <span class="gold">found</span></h1>
    <p class="msg">The page you are looking for does not exist or has moved. Head back to the toolkit and pick up where you left off.</p>
    <a class="cta" href="/">Back to PIPVANT</a>
    <p class="foot"><b>PIPVANT</b> by Orovanta — The Platinum Edge for Serious Traders</p>
  </main>
</body>
</html>
