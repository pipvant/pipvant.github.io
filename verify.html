<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Certificate — PIPVANT</title>
<link rel="icon" href="assets/img/logo.png">
<link rel="stylesheet" href="assets/css/style.css">
<style>
.verify-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px}
.cert{width:100%;max-width:640px;position:relative;overflow:hidden;background:linear-gradient(160deg,#0e1729 0%,#080d18 60%,#0a1220 100%);border:1px solid #2a3a5c;border-radius:24px;padding:48px 44px;box-shadow:0 40px 100px rgba(0,0,0,.6);text-align:center}
.cert::before{content:"";position:absolute;inset:12px;border:1px solid rgba(205,213,228,.18);border-radius:16px;pointer-events:none}
.cert-eyebrow{font-size:.68rem;letter-spacing:.32em;text-transform:uppercase;color:var(--steel);margin-bottom:14px}
.cert h1{font-family:var(--font-display);font-size:clamp(2rem,5vw,2.9rem);color:var(--silver-2);margin:0 0 6px;line-height:1.15}
.cert-level{display:inline-block;margin:14px 0 20px;padding:7px 20px;border:1px solid rgba(205,213,228,.35);border-radius:999px;font-size:.74rem;letter-spacing:.22em;text-transform:uppercase;color:var(--silver-2);background:rgba(205,213,228,.07)}
.cert-desc{color:var(--ink-2);font-size:.95rem;max-width:420px;margin:0 auto 26px}
.cert-to{font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3)}
.cert-name{font-family:var(--font-display);font-size:1.7rem;color:#fff;margin:8px 0 4px}
.cert-date{font-size:.84rem;color:var(--ink-3);margin-bottom:28px}
.cert-seal{width:84px;height:84px;margin:0 auto 20px;border-radius:50%;border:1px solid rgba(205,213,228,.4);display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,rgba(205,213,228,.14),rgba(10,10,16,.4) 70%)}
.cert-seal img{width:52px;height:52px;border-radius:50%}
.cert-sign{margin-top:26px;padding-top:20px;border-top:1px solid var(--line-soft)}
.cert-sign .sig{font-family:Georgia,serif;font-style:italic;font-size:1.6rem;color:var(--silver-2)}
.cert-sign .role{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);margin-top:4px}
.cert-code{margin-top:18px;font-family:ui-monospace,monospace;font-size:.76rem;letter-spacing:.14em;color:var(--ink-3)}
@media(max-width:560px){.cert{padding:36px 26px}}
</style>
</head>
<body>
<header class="site"><div class="wrap nav"><a class="brand" href="index.html"><img src="assets/img/logo.png" alt="PIPVANT logo"><span class="wordcol"><span class="word">PIP<b>VANT</b></span><span class="byline">by Orovanta</span></span></a></div></header>
<main><div class="verify-wrap"><div class="cert" id="cert-box"><p class="micro">Verifying…</p></div></div></main>
<script src="assets/js/config.js"></script>
<script src="assets/js/sb-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/js/supabase.js"></script>
<script>
(function(){var code=new URLSearchParams(location.search).get('c');var box=document.getElementById('cert-box');if(!code){box.innerHTML='<h1>No certificate code</h1><p class="micro">Add ?c=YOUR-CODE to the URL.</p>';return}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function render(cert,name){var d=new Date(cert.earned_at).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});box.innerHTML='<div class="cert-seal"><img src="assets/img/logo.png" alt="PIPVANT"></div><p class="cert-eyebrow">PIPVANT · Certificate of Achievement</p><h1>'+esc(cert.title)+'</h1><div><span class="cert-level">Level '+cert.level+'</span></div><p class="cert-desc">'+esc(cert.description||'')+'</p><p class="cert-to">Awarded to</p><div class="cert-name">'+esc(name)+'</div><p class="cert-date">'+d+'</p><div class="cert-sign"><div class="sig">Saifeddine Ben Iaich</div><div class="role">Founder, PIPVANT</div></div><p class="cert-code">'+esc(cert.verify_code)+' · Verified</p>'}
function fail(){box.innerHTML='<div class="cert-seal"><img src="assets/img/logo.png" alt=""></div><h1>Certificate not found</h1><p class="micro">This code does not match any issued certificate.</p>'}
var tries=0;var t=setInterval(function(){if(window.PV&&window.PV.from){clearInterval(t);window.PV.from('certificates').select('title,description,level,verify_code,earned_at,user_id').eq('verify_code',code).maybeSingle().then(function(res){if(!res.data){fail();return}var cert=res.data;window.PV.from('profiles').select('display_name').eq('id',cert.user_id).maybeSingle().then(function(r2){render(cert,(r2.data&&r2.data.display_name)||'PIPVANT Trader')}).catch(function(){render(cert,'PIPVANT Trader')})}).catch(fail)}if(++tries>100){clearInterval(t);fail()}},100)})();
</script>
</body>
</html>
