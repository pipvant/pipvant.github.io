<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Verify a Certificate — PIPVANT</title>
  <meta name="description" content="Verify a PIPVANT certificate of achievement. Enter the verification ID printed on the certificate to confirm it is genuine.">
  <link rel="canonical" href="https://pipvant.github.io/verify.html">
  <meta property="og:title" content="Verify a Certificate — PIPVANT">
  <meta property="og:description" content="Confirm a PIPVANT certificate is genuine with its verification ID.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://pipvant.github.io/verify.html">
  <meta property="og:image" content="https://pipvant.github.io/assets/pipvanta-logo.png">
  <link rel="icon" type="image/png" href="assets/pipvanta-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}html,body{margin:0;padding:0}
    body{background:#0A1628;color:#EAF1FB;font-family:"Inter",system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
    a{color:#D4AF37}
    header{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid rgba(234,241,251,.08)}
    header img{width:38px;height:38px;border-radius:10px}
    header strong{font-family:"Space Grotesk",sans-serif;letter-spacing:.14em;font-size:17px}
    header span{display:block;color:#8FA6C8;font-size:10px;letter-spacing:.22em;font-weight:600}
    main{flex:1;display:grid;place-items:center;padding:34px 18px 54px}
    .card{width:min(560px,100%);background:linear-gradient(165deg,#0D1D33,#0A1628 60%);border:1px solid rgba(212,175,55,.35);border-radius:20px;padding:34px 30px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
    .kicker{color:#D4AF37;font-size:11px;font-weight:700;letter-spacing:.26em;text-transform:uppercase}
    h1{font-family:"Space Grotesk",sans-serif;font-size:30px;margin:10px 0 8px}
    .lede{color:#A9BBD4;font-size:14px;line-height:1.6;margin:0 0 24px}
    label{display:block;font-size:11px;font-weight:700;letter-spacing:.14em;color:#8FA6C8;text-transform:uppercase;margin-bottom:8px}
    .row{display:flex;gap:10px}
    input{flex:1;min-width:0;background:#081222;border:1px solid rgba(234,241,251,.16);border-radius:12px;color:#EAF1FB;font:600 16px "Space Grotesk",monospace;letter-spacing:.12em;padding:13px 14px;text-transform:uppercase}
    input:focus{outline:2px solid rgba(212,175,55,.55);outline-offset:1px}
    button{background:linear-gradient(135deg,#E8C455,#D4AF37);color:#0A1628;border:0;border-radius:12px;font:700 14px "Inter",sans-serif;padding:0 22px;cursor:pointer;min-height:48px}
    button:disabled{opacity:.55;cursor:wait}
    .result{margin-top:24px;border-radius:14px;padding:20px;display:none}
    .result.ok{display:block;border:1px solid rgba(212,175,55,.55);background:rgba(212,175,55,.07)}
    .result.bad{display:block;border:1px solid rgba(234,241,251,.14);background:rgba(234,241,251,.03)}
    .status{font:700 12px "Inter",sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#D4AF37}
    .result.bad .status{color:#8FA6C8}
    .mission{font-family:"Space Grotesk",sans-serif;font-size:26px;font-weight:700;margin:8px 0 2px}
    .meta{color:#A9BBD4;font-size:13.5px;line-height:1.65}
    .meta strong{color:#EAF1FB}
    footer{padding:18px 22px;border-top:1px solid rgba(234,241,251,.08);color:#5F7492;font-size:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
  </style>
</head>
<body>
  <header>
    <img src="assets/pipvanta-logo.png" alt="PIPVANT">
    <div><strong>PIPVANT</strong><span>BY OROVANTA</span></div>
  </header>
  <main>
    <section class="card" aria-labelledby="vtitle">
      <div class="kicker">Certificate verification</div>
      <h1 id="vtitle">Is this certificate genuine?</h1>
      <p class="lede">Enter the verification ID printed on the certificate — or scan its QR code — and we will check it against PIPVANT's records.</p>
      <form id="vform">
        <label for="vcode">Verification ID</label>
        <div class="row">
          <input id="vcode" name="code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="e.g. 9F3AC21B">
          <button type="submit" id="vbtn">Verify</button>
        </div>
      </form>
      <div class="result" id="vresult" role="status" aria-live="polite"></div>
    </section>
  </main>
  <footer><span>PIPVANT by Orovanta — certificates are earned from real, logged trading records.</span><a href="https://pipvant.github.io/">pipvant.github.io</a></footer>
  <script>
    var ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFjcGt6YXZtaWZqd25za2lhcmV0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyMDk1ODcsImV4cCI6MjEwNjc4NTU4N30.9-k-DoB6467EXTPKrvWUi-LRDPbSSC30f6BgrZezo2A';
    var NAMES = {marathon:'Marathon', profitable:'Profitable', sharpshooter:'Sharpshooter', 'iron discipline':'Iron Discipline', 'risk master':'Risk Master', 'edge proven':'Edge Proven'};
    function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
    function show(html, ok){var r=document.getElementById('vresult');r.className='result '+(ok?'ok':'bad');r.innerHTML=html;}
    function verify(code){
      code=(code||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
      var btn=document.getElementById('vbtn');
      if(code.length<6){show('<div class="status">Too short</div><p class="meta">Enter at least 6 characters of the verification ID printed on the certificate.</p>',false);return;}
      btn.disabled=true;btn.textContent='Checking…';
      fetch('https://acpkzavmifjwnskiaret.supabase.co/rest/v1/rpc/verify_certificate',{
        method:'POST',
        headers:{'apikey':ANON,'Authorization':'Bearer '+ANON,'Content-Type':'application/json'},
        body:JSON.stringify({p_code:code})
      }).then(function(r){return r.json();}).then(function(rows){
        btn.disabled=false;btn.textContent='Verify';
        if(!Array.isArray(rows)||!rows.length){show('<div class="status">Not found</div><p class="meta">No PIPVANT certificate matches this ID. Check the code on the certificate and try again.</p>',false);return;}
        if(rows.length>1){show('<div class="status">Almost there</div><p class="meta">More than one record starts with this code — enter the full verification ID from the certificate.</p>',false);return;}
        var c=rows[0];
        var mission=NAMES[String(c.mission||'').toLowerCase()]||String(c.mission||'—');
        var date=c.earned_at?String(c.earned_at).slice(0,10):'—';
        show('<div class="status">✓ Verified — genuine certificate</div><div class="mission">'+esc(mission)+'</div><p class="meta">Awarded to <strong>'+esc(c.holder||'PIPVANT trader')+'</strong><br>Earned on <strong>'+esc(date)+'</strong> · Record <strong>'+esc(String(c.cert_id||'').slice(0,8).toUpperCase())+'</strong></p>',true);
      }).catch(function(){
        btn.disabled=false;btn.textContent='Verify';
        show('<div class="status">Connection problem</div><p class="meta">We could not reach the verification service. Please try again in a moment.</p>',false);
      });
    }
    document.getElementById('vform').addEventListener('submit',function(e){e.preventDefault();verify(document.getElementById('vcode').value);});
    (function(){
      var code='';
      var m=/[?&#](?:c|id|code)=([A-Za-z0-9-]{6,})/.exec(location.href);
      if(m)code=m[1];
      else if(location.hash&&location.hash.length>6)code=location.hash.slice(1);
      if(code){document.getElementById('vcode').value=code.toUpperCase();verify(code);}
    })();
  </script>
</body>
</html>
