<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#03060f">
<title>Pipvant · Global map</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--bg:#03060f;--card:#0c1528;--tx:#eaf6ff;--mu:#a3b7d4;--line:rgba(190,215,255,.13);--ice2:#6ea8ff;--win:#7ff0d0;--amb:#ffd27a;--glass:rgba(7,13,28,.94)}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(120% 90% at 50% 38%,#0a1a44,#03060f 70%);color:var(--tx);font-family:Inter,"Segoe UI",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}:focus-visible{outline:2px solid #7db0ff;outline-offset:2px}
canvas{position:fixed;inset:0}#stars{z-index:0}#globe{z-index:1;touch-action:none;cursor:grab}#globe:active{cursor:grabbing}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.top{position:fixed;z-index:5;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 0;pointer-events:none}
.top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;min-height:44px}.brand b{display:block;font:800 17px Sora,sans-serif;letter-spacing:-.03em}.brand small{display:block;margin-top:1px;font-size:12px;color:var(--mu)}
.orb{flex:none;width:34px;height:34px;border-radius:50%;background:url(assets/pipvanta-logo.png) center/cover no-repeat;box-shadow:0 0 18px rgba(110,168,255,.6)}
.tb{display:flex;gap:8px}
.ib{width:44px;height:44px;border:1px solid var(--line);border-radius:50%;background:var(--glass);display:grid;place-items:center}
.ib svg{width:21px;height:21px}.ib[aria-pressed=false]{opacity:.55}
.sp{position:fixed;z-index:7;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 62px)}
.search{position:relative}.search svg{position:absolute;left:14px;top:15px;width:18px;height:18px;color:var(--mu);pointer-events:none}
.search input{width:100%;height:48px;padding:0 14px 0 42px;border:1px solid var(--line);border-radius:16px;background:var(--glass);color:var(--tx);font:500 15px Inter;outline:none}
.search input:focus{border-color:#7db0ff}.search input::placeholder{color:#7f93b3}
.res{margin-top:6px;max-height:300px;overflow:auto;padding:6px;border:1px solid var(--line);border-radius:16px;background:rgba(7,13,28,.98)}
.hud{position:fixed;z-index:5;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:grid;justify-items:center;gap:10px;pointer-events:none;transition:opacity .2s}
.hud>*{pointer-events:auto}
.legend{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-size:11.5px;color:var(--mu)}.legend i{width:80px;height:6px;border-radius:6px}
.legend.firms i{background:linear-gradient(90deg,#1f48b8,#7db0ff)}.legend.traders i{background:linear-gradient(90deg,#0e6458,#7ff0d0)}.legend.markets i{background:linear-gradient(90deg,#ffd27a,#f05fcd,#6ea8ff,#7ff0d0)}
.dock{display:flex;gap:8px;align-items:center;padding:6px;border-radius:22px;background:var(--glass);border:1px solid var(--line);box-shadow:0 16px 40px -18px #000}
.seg{display:flex;gap:2px}.seg button{min-height:44px;padding:0 14px;border:0;border-radius:16px;background:none;font:600 13.5px Inter;color:var(--mu)}.seg button[aria-pressed=true]{background:rgba(110,168,255,.22);color:var(--tx)}
.ex{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border:0;border-radius:16px;background:linear-gradient(135deg,#d3e6ff,#7db0ff);color:#03102a;font:700 14px Sora,sans-serif}.ex svg{width:18px;height:18px}
.tip{position:fixed;z-index:9;padding:7px 11px;border-radius:10px;background:rgba(3,8,24,.94);border:1px solid var(--line);font:600 13px Inter;pointer-events:none;white-space:nowrap}
.sheet{position:fixed;z-index:6;left:0;right:0;bottom:0;height:58vh;display:flex;flex-direction:column;border-radius:28px 28px 0 0;border-top:1px solid var(--line);background:var(--glass);box-shadow:0 -24px 50px -26px #000;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px);visibility:hidden}
.sheet.open{transform:none;visibility:visible}.sheet.tall{height:88vh}
.handle{flex:none;height:30px;border:0;background:none;display:grid;place-items:center}.handle::before{content:"";width:42px;height:4px;border-radius:4px;background:rgba(190,215,255,.28)}
.sclose{position:absolute;right:6px;top:2px;width:44px;height:44px;border:0;border-radius:50%;background:none;font-size:26px;line-height:1;color:var(--mu)}
#body{flex:1;overflow:auto;padding:0 16px 22px;overscroll-behavior:contain}
h2{margin:0 0 6px;font:800 22px/1.15 Sora,sans-serif;letter-spacing:-.03em}h3{margin:20px 0 10px;font:700 12px Inter;letter-spacing:.09em;text-transform:uppercase;color:var(--mu)}
.sub{margin:0 0 14px;font-size:14px;line-height:1.5;color:var(--mu)}.fine{margin:14px 0 0;font-size:12px;line-height:1.5;color:#7f93b3}
.stats{display:flex;gap:8px}.stats div{flex:1;padding:12px 6px;border-radius:16px;background:rgba(190,215,255,.07);border:1px solid var(--line);text-align:center}
.stats b{display:block;font:800 21px Sora,sans-serif}.stats small{font-size:12px;color:var(--mu)}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:6px 10px;border:0;border-radius:14px;background:none;text-align:start}
.row:hover{background:rgba(190,215,255,.08)}.row .fl{font-size:24px}.row .nm{flex:1;font:600 15px Inter}.row .val{font-size:13px;color:var(--mu)}
.back{min-height:44px;margin:0 0 4px -8px;padding:0 8px;border:0;background:none;color:var(--ice2);font:600 14px Inter}
.chead{display:flex;align-items:center;gap:12px;margin-bottom:14px}.chead .big{font-size:40px;line-height:1}
.bar{margin-bottom:12px}.bt{display:flex;justify-content:space-between;margin-bottom:6px;font:600 14px Inter}.bv{color:var(--mu);font-weight:500}
.tr{height:8px;border-radius:8px;background:rgba(190,215,255,.1);overflow:hidden}.tr i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#6ea8ff,#7ff0d0)}
.firm{display:flex;align-items:center;gap:12px;width:100%;padding:12px;margin-bottom:8px;border-radius:18px;background:var(--card);border:1px solid var(--line);text-align:start}
.firm[aria-pressed=true]{border-color:#7ff0d0;background:rgba(127,240,208,.1)}
.mono{flex:none;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:#eef3ff;color:#1b3bb8;font:800 17px Sora,sans-serif}
.fmid{flex:1;min-width:0}.fmid b{display:block;font:600 15px Inter}.fmid small{display:block;margin-top:2px;font-size:12px;line-height:1.35;color:var(--mu)}
.st{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 10px;border-radius:999px;background:rgba(190,215,255,.08);font:600 12px Inter}.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st.live{color:var(--win)}.st.soon{color:var(--amb)}.st.closed{color:#8b9ab5}
.cta{width:100%;min-height:52px;margin-top:6px;border:0;border-radius:16px;background:linear-gradient(135deg,#d3e6ff,#7db0ff);color:#03102a;font:700 15px Sora,sans-serif;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.cta.ghost{background:rgba(190,215,255,.08);color:var(--tx);box-shadow:inset 0 0 0 1px var(--line)}
.cta[aria-pressed=true]{background:rgba(127,240,208,.14);color:var(--win);box-shadow:inset 0 0 0 1.5px var(--win)}
.empty{padding:18px;border:1.5px dashed rgba(190,215,255,.3);border-radius:20px;text-align:center}.empty b{font:700 17px Sora,sans-serif}.empty p{margin:8px 0 14px;font-size:14px;line-height:1.5;color:var(--mu)}
.msg{position:fixed;z-index:4;left:0;right:0;top:44%;text-align:center;font:500 15px Inter;color:var(--mu);padding:0 24px}
.ovl{margin:0 0 12px;padding:12px 14px;border-radius:16px;background:rgba(190,215,255,.07);border:1px solid var(--line);font:600 14px Inter;color:var(--mu)}
.ovl.on{color:#06231c;background:linear-gradient(135deg,#7ff0d0,#9fe8ff);border-color:transparent}
.srow{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 12px;margin-bottom:8px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.dot{flex:none;width:14px;height:14px;border-radius:50%}.smid{flex:1;min-width:0}.smid b{display:block;font:600 15px Inter}.smid small{font-size:12px;color:var(--mu)}
.sr2{display:grid;justify-items:end;gap:4px}.cd{font-size:12px;color:var(--mu)}
.shm{position:fixed;z-index:20;inset:0;display:grid;place-items:center;padding:14px;background:rgba(2,5,14,.9)}.shm[hidden]{display:none}
.shc{width:100%;max-width:420px;max-height:100%;overflow:auto;padding:14px;border-radius:24px;background:#0a1226;border:1px solid var(--line)}
.shc img{display:block;width:100%;max-height:58vh;object-fit:contain;border-radius:14px;background:#050a18}
.shc .seg{margin:12px 0;justify-content:center}.shc .two{display:flex;gap:8px}.shc .two button{flex:1}
@media (min-width:900px){
 .sheet{left:auto;top:0;width:400px;height:100%;border-radius:0;border-top:0;border-left:1px solid var(--line);box-shadow:-24px 0 50px -26px #000;transform:translateX(104%)}
 .sheet.open{transform:none}.sheet.tall{height:100%}.handle{display:none}#body{padding-top:30px}.sclose{top:10px;right:10px}
 .so .hud{right:400px}.so .top{right:400px}.sp{width:360px;right:auto}
}
@media (max-width:380px){.seg button{padding:0 9px;font-size:12.5px}.ex{padding:0 12px}}
@media (prefers-reduced-motion:reduce){.sheet,.hud{transition:none}}
.so .hud{opacity:0;pointer-events:none}@media (min-width:900px){.so .hud{opacity:1;pointer-events:none}.so .hud>*{pointer-events:auto}}
</style></head><body>
<canvas id="stars" aria-hidden="true"></canvas>
<canvas id="globe" role="img" aria-label="Interactive 3D globe. Use the search button or the Explore list to choose a country with the keyboard."></canvas>
<header class="top">
 <div class="brand"><span class="orb"></span><div><b>Pipvant</b><small>Global map</small></div></div>
 <div class="tb">
  <button id="sbtn" class="ib" type="button" aria-label="Search a country"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
  <button id="spin" class="ib" type="button" aria-pressed="true" aria-label="Auto-rotate the globe"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg></button>
 </div>
</header>
<div id="sp" class="sp" hidden><div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search a country" aria-label="Search a country" autocomplete="off"></div><div id="res" class="res" hidden></div></div>
<div id="tip" class="tip" hidden></div>
<div class="hud">
 <div class="legend firms" id="legend"><span id="lt">Firms per country</span><i></i><span id="l1">fewer</span><span id="l2">more</span></div>
 <div class="dock">
  <div class="seg" role="group" aria-label="Map layer"><button type="button" data-layer="firms" aria-pressed="true">Firms</button><button type="button" data-layer="traders" aria-pressed="false">Traders</button><button type="button" data-layer="markets" aria-pressed="false">Markets</button></div>
  <button id="explore" class="ex" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Explore</button>
 </div>
</div>
<aside id="sheet" class="sheet" aria-label="Details"><button id="handle" class="handle" type="button" aria-label="Expand or collapse the panel"></button><button id="sclose" class="sclose" type="button" aria-label="Close panel">×</button><div id="body"></div></aside>
<div id="shm" class="shm" hidden><div class="shc" role="dialog" aria-modal="true" aria-label="Share image"><img id="shimg" alt="Preview of the share image"><div class="seg" role="group" aria-label="Image format"><button type="button" data-kind="post" aria-pressed="true">Post 4:5</button><button type="button" data-kind="story" aria-pressed="false">Story 9:16</button></div><div class="two"><button id="shsave" class="cta ghost" type="button">Save</button><button id="shshare" class="cta" type="button">Share</button></div><button id="shclose" class="cta ghost" type="button">Close</button></div></div>
<div id="loading" class="msg">Loading the world…</div>
<div id="fail" class="msg" hidden>Couldn’t load the map data. Check your connection and reload the page.</div>
<div id="live" class="sr" aria-live="polite"></div>

  for (const u of urls) {
